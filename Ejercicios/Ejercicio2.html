<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario - Nicolás Calle</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 8px;
      color: #1a1a1a;
      font-size: 1.5rem;
    }

    .card p.subtitle {
      margin-top: 0;
      margin-bottom: 24px;
      color: #666;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
      transition: all 0.2s ease-in-out;
    }

    input:focus {
      border-color: #2563eb;
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    input:invalid:not(:placeholder-shown) {
      border-color: #dc2626;
      background-color: #fef2f2;
    }

    input:valid:not(:placeholder-shown) {
      border-color: #16a34a;
      background-color: #f0fdf4;
    }

    .hint {
      display: block;
      margin-top: 5px;
      font-size: 0.8rem;
      color: #6b7280;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 10px;
    }

    button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Crear Cuenta</h2>
    <p class="subtitle">Ingresa tus datos para completar el registro.</p>

    <form action="/procesar-registro" method="POST">

      <div class="form-group">
        <label for="username">Usuario</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          required 
          minlength="4" 
          maxlength="15" 
          pattern="[a-zA-Z0-9_]+" 
          placeholder="Ej: nicolas_calle"
          title="Usa entre 4 y 15 caracteres (solo letras, números y guión bajo)."
        >
        <span class="hint">De 4 a 15 caracteres (sin espacios ni caracteres especiales).</span>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required 
          placeholder="nicolas.calle@ejemplo.com"
          title="Ingresa un correo institucional o personal válido."
        >
        <span class="hint">Ejemplo: tu_correo@dominio.com</span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          minlength="8" 
          maxlength="20" 
          pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,20}" 
          placeholder="••••••••"
          title="Debe incluir al menos una mayúscula, una minúscula y un número."
        >
        <span class="hint">Entre 8 y 20 caracteres (incluye mayúscula, minúscula y número).</span>
      </div>

      <div class="form-group">
        <label for="phone">Teléfono móvil</label>
        <input 
          type="tel" 
          id="phone" 
          name="phone" 
          required 
          pattern="9[0-9]{8}" 
          maxlength="9"
          placeholder="987654321"
          title="Debe ser un número móvil de 9 dígitos que empiece con 9."
        >
        <span class="hint">9 dígitos iniciando con el número 9.</span>
      </div>

      <button type="submit">Completar Registro</button>
    </form>
  </div>

</body>
</html>
